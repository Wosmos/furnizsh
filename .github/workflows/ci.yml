name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Static analysis — the fast gate. Everything else is slower,
  # so this runs first and the rest only if it passes.
  # ------------------------------------------------------------
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint bash scripts
        run: shellcheck --severity=warning install.sh uninstall.sh doctor.sh update.sh bin/furnizsh scripts/*.sh

      - name: The bootstrap must be POSIX sh, not bash
        run: |
          # It runs before we know anything about the machine, including
          # whether bash exists — so dash is the honest check.
          sudo apt-get update && sudo apt-get install -y dash
          dash -n site/install
          shellcheck --shell=sh --severity=warning site/install

      # The zsh files use zsh-only syntax that shellcheck can't parse,
      # so they get zsh's own parser instead.
      - name: Install zsh
        run: sudo apt-get install -y zsh

      - name: Parse zsh config
        run: |
          for f in config/zsh/*.zsh; do
            echo "checking $f"
            zsh -n "$f"
          done

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyse
        shell: pwsh
        run: |
          # PSReviewUnusedParameter fires on every script-scope param read inside
          # a nested function, which is how all of these installers are written.
          # PSUseBOMForUnicodeEncodedFile is handled by the BOM check below, which
          # is stricter — it verifies the bytes rather than trusting the linter.
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,`
                         PSAvoidUsingInvokeExpression,PSReviewUnusedParameter,`
                         PSUseBOMForUnicodeEncodedFile
          if ($results) {
            $results | Format-Table -AutoSize
            throw "$($results.Count) PSScriptAnalyzer finding(s)"
          }
          Write-Host "PSScriptAnalyzer clean"

      - name: Non-ASCII scripts carry a UTF-8 BOM
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 reads a BOM-less file as ANSI, which mangles
          # every non-ASCII character. Any script containing one needs the BOM.
          $bad = @()
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $nonAscii = $bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1
            if ($nonAscii -and -not $hasBom) { $bad += $f.Name }
          }
          if ($bad) { throw "missing UTF-8 BOM: $($bad -join ', ')" }
          Write-Host "BOM check clean"

      - name: Parse every script
        shell: pwsh
        run: |
          $errors = $null
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "$($f.Name): $($errors[0].Message)" }
          }
          Write-Host "all .ps1 files parse"

  # ------------------------------------------------------------
  # Config validity — catches a broken YAML/JSON/TOML theme before
  # anyone installs it.
  # ------------------------------------------------------------
  configs:
    name: config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML, JSON and TOML
        run: |
          python3 - <<'PY'
          import json, sys, pathlib, tomllib
          ok = True

          for f in pathlib.Path('config').rglob('*.json'):
              try:
                  json.loads(f.read_text())
                  print(f"OK   {f}")
              except Exception as e:
                  print(f"FAIL {f}: {e}"); ok = False

          for f in pathlib.Path('config').rglob('*.toml'):
              try:
                  tomllib.loads(f.read_text())
                  print(f"OK   {f}")
              except Exception as e:
                  print(f"FAIL {f}: {e}"); ok = False

          sys.exit(0 if ok else 1)
          PY

      - name: Validate lazygit themes
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, sys, pathlib
          ok = True
          for f in pathlib.Path('config/themes/lazygit').glob('*.yml'):
              try:
                  data = yaml.safe_load(f.read_text())
                  assert 'gui' in data and 'theme' in data['gui'], "missing gui.theme"
                  print(f"OK   {f}")
              except Exception as e:
                  print(f"FAIL {f}: {e}"); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Every theme defines the required keys
        run: |
          fail=0
          for f in config/themes/*.theme; do
            for key in THEME_ID THEME_LABEL THEME_BLURB GHOSTTY_THEME STARSHIP_PRESET LAZYGIT_PALETTE; do
              grep -q "^${key}=" "$f" || { echo "FAIL $f missing $key"; fail=1; }
            done
            # the palette it names must actually exist
            palette=$(sed -n 's/^LAZYGIT_PALETTE="\(.*\)"/\1/p' "$f")
            test -f "config/themes/lazygit/${palette}.yml" \
              || { echo "FAIL $f references missing palette ${palette}.yml"; fail=1; }
            echo "OK   $f"
          done
          exit $fail

  # ------------------------------------------------------------
  # Nothing environment-specific may ever reach this repo.
  # ------------------------------------------------------------
  secrets:
    name: no secrets or personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets and machine-specific paths
        run: |
          fail=0
          # Absolute home paths would only ever be someone's machine.
          if grep -rnE '/(Users|home)/[a-z]' --include='*.sh' --include='*.zsh' \
               --include='*.ps1' --include='*.toml' --include='*.yml' . ; then
            echo "FAIL: absolute home path found — use \$HOME"; fail=1
          fi
          # Credential shapes.
          if grep -rnE 'gh[pousr]_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
               --exclude-dir=.git . ; then
            echo "FAIL: credential-shaped string found"; fail=1
          fi
          # Telemetry endpoints. Deliberately narrow: cc-alert.env is a config
          # file this repo ships by name, not a dotenv full of secrets, so match
          # dotenv-style secret loading rather than the substring ".env".
          if grep -rniE 'OTEL_EXPORTER|OTEL_METRICS|source .*/\.env["\x27 ]*$' \
               --include='*.sh' --include='*.zsh' --include='*.ps1' . ; then
            echo "FAIL: telemetry or dotenv-secret reference found"; fail=1
          fi
          # A committed .env file is always wrong, whatever its contents.
          if find . -path ./.git -prune -o -name '.env' -print -o -name '.env.*' -print | grep . ; then
            echo "FAIL: committed .env file"; fail=1
          fi
          [ $fail -eq 0 ] && echo "clean"
          exit $fail

  # ------------------------------------------------------------
  # The real test: install into a clean container and verify.
  # ------------------------------------------------------------
  install:
    name: install on ${{ matrix.distro }}
    needs: [shellcheck, configs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            bootstrap: apt-get update && apt-get install -y sudo curl git zsh ca-certificates
          - distro: fedora
            image: fedora:41
            bootstrap: dnf install -y sudo curl git zsh
          - distro: arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm sudo curl git zsh

    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - name: Bootstrap the container
        run: ${{ matrix.bootstrap }}

      - uses: actions/checkout@v4

      - name: Seed a .zshrc that must survive the whole cycle
        run: |
          # Content on both sides of where the block lands, plus interior blank
          # lines, so the uninstall check exercises more than an empty file.
          printf '# my own zshrc\nexport FOO=bar\n\n\nalias mine="echo hi"\n' > "$HOME/.zshrc"
          cp "$HOME/.zshrc" /tmp/zshrc.orig

      - name: Dry run changes nothing
        run: |
          # No diffutils in the Fedora/Arch images — and `diff a b && echo ok`
          # silently passes when diff is missing, because a failure inside an
          # && list does not trip `sh -e`. Hash instead.
          before=$(sha256sum "$HOME/.zshrc" | cut -d' ' -f1)
          ./install.sh --dry-run --tools core
          after=$(sha256sum "$HOME/.zshrc" | cut -d' ' -f1)
          [ "$before" = "$after" ] || { echo "dry run modified .zshrc"; exit 1; }
          echo "dry run left .zshrc untouched"
          test ! -d "$HOME/.config/furnizsh" || { echo "dry run created the config dir"; exit 1; }
          echo "dry run created nothing"

      - name: Install
        run: ./install.sh --yes --no-font --no-claude --no-chsh --tools core

      - name: The shell config loads without error
        run: zsh -c 'source "$HOME/.config/furnizsh/furnizsh.zsh" && echo "furnizsh.zsh sourced OK"'

      - name: Commands are defined
        run: |
          zsh -c '
            source "$HOME/.config/furnizsh/furnizsh.zsh"
            missing=0
            for fn in cheatsheet fzdoctor theme fzupdate mkcd up serve ports killport \
                      fkill fe bak sizeof gprune paths reload \
                      weather cheat qr gitignore note timer sysinfo dockerclean; do
              if typeset -f $fn >/dev/null 2>&1 || alias $fn >/dev/null 2>&1; then
                echo "  OK   $fn"
              else
                echo "  MISS $fn"; missing=1
              fi
            done
            exit $missing
          '

      - name: The pre-furnizsh ag* names still resolve
        run: |
          # agdoctor and agupdate shipped in 1.0.0. They are aliases now, and
          # removing them would break every existing install and any script
          # calling them.
          zsh -c '
            source "$HOME/.config/furnizsh/furnizsh.zsh"
            fail=0
            for old in agdoctor agupdate; do
              alias $old >/dev/null 2>&1 || { echo "  MISS $old"; fail=1; continue; }
              echo "  OK   $old -> $(alias $old | sed "s/.*=//;s/'"'"'//g")"
            done
            exit $fail
          '

      - name: cheatsheet renders
        run: zsh -c 'source "$HOME/.config/furnizsh/furnizsh.zsh"; cheatsheet | head -5; cheatsheet --comp | head -5'

      - name: Themes are installed and switchable
        run: |
          zsh -c '
            source "$HOME/.config/furnizsh/furnizsh.zsh"
            theme
            for t in catppuccin gruvbox tokyonight neon; do
              theme $t >/dev/null || exit 1
              got=$(cat "$HOME/.config/furnizsh/current-theme")
              [ "$got" = "$t" ] || { echo "expected $t, got $got"; exit 1; }
              echo "  OK   switched to $t"
            done
          '

      - name: The furnizsh command works from a packaged layout
        run: |
          # Simulate what Homebrew does: payload in share/, command in bin/.
          mkdir -p /tmp/pkg/share/furnizsh /tmp/pkg/bin
          cp -R config extras install.sh uninstall.sh doctor.sh update.sh VERSION /tmp/pkg/share/furnizsh/
          cp bin/furnizsh /tmp/pkg/bin/
          export FURNIZSH_SHARE=/tmp/pkg/share/furnizsh
          /tmp/pkg/bin/furnizsh version | grep -q "$(cat VERSION)"
          /tmp/pkg/bin/furnizsh theme | grep -q gruvbox
          /tmp/pkg/bin/furnizsh help  | grep -q "neon terminal"
          echo "dispatcher OK"

      - name: The installed copy reports its version
        run: |
          test "$(cat "$HOME/.config/furnizsh/VERSION")" = "$(cat VERSION)" \
            || { echo "stamped version does not match VERSION"; exit 1; }
          echo "version stamped correctly"

      - name: The install method is recorded for fzupdate
        run: |
          # fzupdate reads this to decide whether to run brew, npm, the
          # bootstrap or git pull. Without it, it can only tell the user to
          # work it out themselves.
          f="$HOME/.config/furnizsh/install-source"
          test -f "$f" || { echo "install-source was not written"; exit 1; }
          test "$(sed -n 1p "$f")" = "git" \
            || { echo "expected method 'git' from a checkout, got '$(sed -n 1p "$f")'"; exit 1; }
          test -d "$(sed -n 2p "$f")/.git" \
            || { echo "recorded path is not a checkout"; exit 1; }
          echo "install source recorded: $(sed -n 1p "$f")"

      - name: Rerun is idempotent
        run: |
          sha_before=$(sha256sum "$HOME/.zshrc" | cut -d' ' -f1)
          ./install.sh --yes --no-font --no-claude --no-chsh --tools core
          sha_after=$(sha256sum "$HOME/.zshrc" | cut -d' ' -f1)
          [ "$sha_before" = "$sha_after" ] || { echo ".zshrc changed on rerun"; exit 1; }
          [ "$(grep -c 'furnizsh.zsh' "$HOME/.zshrc")" = "1" ] || { echo "duplicate source line"; exit 1; }
          echo "idempotent"

      - name: Uninstall restores the original .zshrc byte-for-byte
        run: |
          # The README and the site both claim byte-for-byte restoration, so
          # assert exactly that rather than just grepping the marker away.
          # (A .zshrc with no trailing newline gains one — POSIX text files end
          # in a newline — so the reference copy is normalised the same way.)
          ./uninstall.sh --yes
          grep -q 'furnizsh' "$HOME/.zshrc" && { echo "block still present"; exit 1; }
          test ! -d "$HOME/.config/furnizsh" || { echo "config dir still present"; exit 1; }
          orig=$(sha256sum /tmp/zshrc.orig | cut -d' ' -f1)
          now=$(sha256sum "$HOME/.zshrc" | cut -d' ' -f1)
          [ "$orig" = "$now" ] || {
            echo "restored .zshrc differs from the original"
            echo "--- expected ---"; od -c /tmp/zshrc.orig
            echo "--- actual ---";   od -c "$HOME/.zshrc"
            exit 1
          }
          echo "clean uninstall, byte-identical"

  # ------------------------------------------------------------
  # Version consistency. Cheap, and catches the mistake that would
  # otherwise only surface at release time.
  # ------------------------------------------------------------
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VERSION, CHANGELOG and the packaging manifests agree
        run: |
          V="$(cat VERSION)"
          echo "VERSION: $V"
          fail=0

          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "FAIL: '$V' is not semver"; fail=1; }

          grep -q "^## \[$V\]" CHANGELOG.md \
            || { echo "FAIL: CHANGELOG.md has no '## [$V]' section"; fail=1; }

          NPM=$(python3 -c "import json;print(json.load(open('packaging/npm/package.json'))['version'])")
          [ "$NPM" = "$V" ] || { echo "FAIL: package.json says $NPM"; fail=1; }

          PSD=$(sed -n "s/.*ModuleVersion *= *'\([^']*\)'.*/\1/p" packaging/powershell/furnizsh.psd1)
          [ "$PSD" = "$V" ] || { echo "FAIL: furnizsh.psd1 says $PSD"; fail=1; }

          BREW=$(sed -n 's|.*/tags/v\([0-9.]*\)\.tar\.gz.*|\1|p' packaging/homebrew/furnizsh.rb)
          [ "$BREW" = "$V" ] || { echo "FAIL: the formula url pins $BREW"; fail=1; }

          [ $fail -eq 0 ] && echo "all manifests agree on $V"
          exit $fail

  # ------------------------------------------------------------
  # The Pages site: every page well-formed, no external requests,
  # and no rule depending on a token that isn't on bare :root.
  # ------------------------------------------------------------
  site:
    name: pages site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every page is well-formed
        run: |
          python3 - <<'PY'
          import html.parser, pathlib, sys

          PAGES = ["index.html", "themes.html", "commands.html", "install.html"]
          VOID = {'area','base','br','col','embed','hr','img','input',
                  'link','meta','source','track','wbr'}

          class P(html.parser.HTMLParser):
              def __init__(s):
                  super().__init__(convert_charrefs=True); s.stack=[]; s.errs=[]
              def handle_starttag(s, t, a):
                  if t not in VOID: s.stack.append((t, s.getpos()))
              def handle_endtag(s, t):
                  if not s.stack: s.errs.append(f"stray </{t}> at {s.getpos()}"); return
                  top, pos = s.stack.pop()
                  if top != t:
                      s.errs.append(f"</{t}> at {s.getpos()} closes <{top}> opened at {pos}")

          ok = True
          for f in PAGES:
              p = P(); p.feed(pathlib.Path("site")/f and (pathlib.Path("site")/f).read_text())
              bad = [t for t, _ in p.stack]
              if bad or p.errs:
                  print(f"FAIL {f}: unclosed={bad} errors={p.errs}"); ok = False
              else:
                  print(f"OK   {f}")
          sys.exit(0 if ok else 1)
          PY

      - name: No external requests
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          # A strict CSP applies wherever these pages get embedded, and Pages
          # should not depend on third-party hosts either. Relative src/href are
          # same-origin and fine; absolute ones must be on the allow-list, and
          # scripts and stylesheets must never be absolute at all.
          ALLOWED = ('https://github.com/', 'https://wosmos.github.io/',
                     'https://ghostty.org', 'https://starship.rs',
                     'https://ohmyz.sh', 'https://catppuccin.com',
                     'https://nerdfonts.com')
          ok = True
          for f in ["index.html","themes.html","commands.html","install.html"]:
              src = (pathlib.Path("site")/f).read_text()

              for url in re.findall(r'(?:src|href)="(https?://[^"]+)"', src):
                  if not url.startswith(ALLOWED):
                      print(f"FAIL {f}: unexpected external reference {url}"); ok = False

              # Only tags that actually FETCH something matter. rel="canonical",
              # og:url and friends are absolute by definition and load nothing,
              # so they must not trip this.
              FETCHING = ('stylesheet', 'preload', 'modulepreload', 'prefetch',
                          'preconnect', 'dns-prefetch', 'icon', 'manifest',
                          'apple-touch-icon')
              for tag in re.findall(r'<script[^>]*>', src):
                  m = re.search(r'src="(https?://[^"]+)"', tag)
                  if m:
                      print(f"FAIL {f}: script loaded from {m.group(1)}"); ok = False
              for tag in re.findall(r'<link[^>]*>', src):
                  rel = re.search(r'rel="([^"]+)"', tag)
                  href = re.search(r'href="(https?://[^"]+)"', tag)
                  if rel and href and any(r in FETCHING for r in rel.group(1).split()):
                      print(f"FAIL {f}: {rel.group(1)} fetched from {href.group(1)}"); ok = False

          print("site is self-contained" if ok else "")
          sys.exit(0 if ok else 1)
          PY

      - name: Every CSS token is defined on bare :root
        run: |
          python3 - <<'PY'
          import re, pathlib, sys

          css = pathlib.Path("site/css/style.css").read_text()
          root = css.split(":root {")[1].split("}")[0]
          defined = set(re.findall(r'--([a-z0-9-]+)\s*:', root))

          used = set(re.findall(r'var\(--([a-z0-9-]+)', css))
          for f in ["index.html","themes.html","commands.html","install.html"]:
              used |= set(re.findall(r'var\(--([a-z0-9-]+)', (pathlib.Path("site")/f).read_text()))

          missing = used - defined
          if missing:
              print("tokens used but not defined on bare :root:", sorted(missing))
              sys.exit(1)
          print(f"all {len(used)} tokens defined")
          PY

      - name: Brand assets are present
        run: |
          cd site
          for f in assets/icons/favicon.ico assets/icons/icon-192.png \
                   assets/icons/icon-512.png assets/icons/apple-touch-icon.png \
                   assets/img/og-image.png assets/img/mascot.png \
                   site.webmanifest css/style.css js/app.js install \
                   sitemap.xml robots.txt; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          python3 -c "import json; json.load(open('site.webmanifest'))"
          python3 -c "import xml.dom.minidom as m; m.parse('sitemap.xml')"

          # every page must be listed in the sitemap, or it won't be indexed
          python3 - <<'PY'
          import pathlib, re, sys
          sm = pathlib.Path("sitemap.xml").read_text()
          listed = set(re.findall(r'<loc>([^<]+)</loc>', sm))
          missing = []
          for p in sorted(pathlib.Path(".").glob("*.html")):
              url = "https://wosmos.github.io/furnizsh/" + ("" if p.name == "index.html" else p.name)
              if url not in listed:
                  missing.append(p.name)
          if missing:
              print("pages missing from sitemap.xml:", missing); sys.exit(1)
          print(f"sitemap lists all {len(listed)} pages")
          PY

          grep -q "Sitemap: https://wosmos.github.io/furnizsh/sitemap.xml" robots.txt \
            || { echo "robots.txt does not point at the sitemap"; exit 1; }
          echo "assets present, manifest/sitemap/robots valid"
