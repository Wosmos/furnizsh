# ============================================================
#  furnizsh — tmux
#  https://github.com/Wosmos/furnizsh
#
#  Installed to ~/.tmux.conf with `--tools extended` or `--tools all`
#  (skip it with --no-tmux). Themed to match the prompt.
#
#  Reload after editing:  tmux source-file ~/.tmux.conf
# ============================================================

# ------------------------------------------------------------
# Prefix: ctrl+a instead of ctrl+b — reachable without moving
# your hand, and it doesn't collide with the readline ctrl+b
# (move back one char) that zsh uses.
# ------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ------------------------------------------------------------
# Behaviour
# ------------------------------------------------------------
set -g mouse on                    # click panes, drag borders, scroll
set -g base-index 1                # windows start at 1, matching the keys
setw -g pane-base-index 1
set -g renumber-windows on         # no gaps after closing a window
set -g history-limit 50000
set -g escape-time 10              # stops vim feeling laggy inside tmux
set -g focus-events on
set -g set-clipboard on

# Truecolor. Without both of these the Catppuccin/Gruvbox colours
# degrade to the nearest 256-colour approximation and look muddy.
set  -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# ------------------------------------------------------------
# Splits — mirroring Ghostty's cmd+d / cmd+shift+d, and opening
# in the current directory rather than $HOME.
# ------------------------------------------------------------
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize, repeatable (hold the key after the prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r Tab last-window
bind z resize-pane -Z              # zoom the current pane
bind r source-file ~/.tmux.conf \; display "reloaded"

# ------------------------------------------------------------
# Copy mode — vi keys, and `y` copies to the system clipboard
# ------------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ------------------------------------------------------------
# Theme — Catppuccin Mocha, matching the default furnizsh look.
# For gruvbox/tokyonight, swap the six colours below; the layout
# doesn't change.
#   mauve #cba6f7   surface #313244   base #1e1e2e
#   text  #cdd6f4   overlay #6c7086   green #a6e3a1
# ------------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cba6f7]  "
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#a6e3a1]● ,}#[fg=#6c7086]%H:%M #[fg=#cba6f7]#[bg=#cba6f7,fg=#1e1e2e,bold] #h "

setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I #W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#313244,fg=#f9e2af"
